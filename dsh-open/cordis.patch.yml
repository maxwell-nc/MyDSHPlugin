# dsh profile 补丁片段 —— dsh-open 组合包自带的 patch 层。
#
# `insert` 不带 `id` 时新条目直接追加到根条目列表；`name` 必须是**裸包标识符**
# `dsh-open`：组合包由 plugin_manager install_bundle 装进 profile 的
# node_modules，Loader 按包名解析。写成路径（`./…`）会被
# bundleComponentManifests() 直接跳过，本组合包声明的组件就拿不到 DSH
# peer 兼容检查（这个坑 usage/cordis.patch.yml 里记过）。
#
# 浏览器那半边（lib/client.js）不在这里声明：dsh 的 client-modules 会按包清单
# 里的 `dsh.client` 字段自动发现 `exports["./client"]`，并入插件图。
- insert:
    - id: dsh-open
      name: dsh-open
