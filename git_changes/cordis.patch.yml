# dsh profile 补丁片段 —— 把本插件 host 半边插进 profile 的插件树。
#
# 本片段是一个 YAML 列表，不要写 YAML 文档头。
# `insert` 不带 `id` 时新条目直接追加到根条目列表。
#
# 这是一个组合包层（见 package.json 的 dsh.bundle.patch），按 profile 的
# package.json 里 dsh.profile.bundles 的顺序在各 bundle 层中应用。
# `name` 写裸包标识符（dsh-git-changes）而不是文件路径：组合包层据此定位包里的
# host 半边，这个条目也因此进入 DSH 的 peer 兼容检查。
#
# 浏览器半边（lib/client.js）不需要在这里声明：dsh 的 client-modules 会按包清单里的
# `dsh.client` 字段自动发现它 —— 见同目录 package.json 的 exports["./client"]。
- insert:
    - id: dsh-git-changes
      name: dsh-git-changes
