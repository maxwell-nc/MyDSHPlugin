# dsh profile 补丁片段 —— dsh-stuck-fix 组合包自带的 patch 层。
#
# 与 dsh-motion-control / dsh-whale-title 同一套路：
#   * `insert` 不带 `id` 时新条目直接追加到根条目列表；
#   * `name` 必须是**裸包标识符** `dsh-stuck-fix`：组合包由 pnpm 装进
#     profile 的 node_modules，Loader 按包名解析。
#
# client 半边（lib/client.js）不在这里声明：dsh 的 client-modules 会按包清单
# 里的 `dsh.client` 字段自动发现 `exports["./client"]`，但前提是**本包必须是
# profile 插件树里的一个 loader 行** —— 所以这里必须把 host 半边插进树里，
# client 才会被装上。
- insert:
    - id: dsh-stuck-fix
      name: dsh-stuck-fix
